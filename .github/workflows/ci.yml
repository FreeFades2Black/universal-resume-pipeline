name: CI & Extension Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Run Test Suite & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Execute Pytest Suite
        run: |
          python -m pytest -v

  package-extension:
    name: Package Manifest V3 Chrome Extension
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Archive Extension Directory
        run: |
          cd extension
          zip -r ../universal-resume-autofill-extension.zip ./*

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-resume-autofill-extension
          path: universal-resume-autofill-extension.zip
          retention-days: 14
